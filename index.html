<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Storytelling about NASA's Discarded Equipment on the Moon and Mars">
  <title>Abandoned but not Forgotten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <!-- Екран 1: вибір планети -->
    <section class="screen screen--home is-active" id="home-screen">
      <div class="home-copy">
        <p class="eyebrow">Storytelling about NASA's Discarded Equipment on the Moon and Mars</p>
        <h1>Celestial Guide</h1>
      </div>
      
      <div class="world-picker">

        <!-- Місяць -->
        <button
          class="world-card world-card--moon"
          data-world="moon"
          aria-label="Обрати Місяць"
        >
          <div
            class="planet-model"
            data-model-path="/assets/models/planets/moon.glb"
          ></div>

          <span class="world-name">Moon</span>
          <span class="world-subtitle">
            Silence at a distance of 384,400 km
          </span>
          <span class="world-action">
            Explore <span aria-hidden="true">↗</span>
          </span>
        </button>

        <!-- Марс -->
        <button
          class="world-card world-card--mars"
          data-world="mars"
          aria-label="Обрати Марс"
        >
          <div
            class="planet-model"
            data-model-path="/assets/models/planets/mars.glb"
          ></div>

          <span class="world-name">Mars</span>
          <span class="world-subtitle">
            Endless red desert
          </span>
          <span class="world-action">
            Explore <span aria-hidden="true">↗</span>
          </span>
        </button>

      </div>

      <div class="planet-viewers">


</div>
      <div class="wanderers" id="wanderers">
  <!-- JavaScript автоматично розмістить тут персонажів -->
      </div>
    </section>

    <!-- Екран 2: вибір персонажа -->
<section class="screen screen--characters" id="character-screen">
  <div class="planet-horizon-bg" id="character-planet-bg"></div>
  <header class="topbar">
    <button class="back-button" id="back-home">
      ← <span>To the deep space</span>
    </button>
    <span class="topbar-mark"></span>
  </header>

  <div class="section-heading">
    <p class="eyebrow" id="character-eyebrow"></p>
    <h2>Choose your<br><span>character</span></h2>
  </div>

  <div class="character-grid" id="character-grid"></div>

  <div class="home-footer">
    <span>02 / 03</span>
    
  </div>
</section>

    <!-- Екран 3: візуальна новела -->
    <section class="screen screen--story" id="story-screen">
      <div class="story-background" id="story-background"></div>
      <div class="planet-horizon-bg planet-horizon-bg--story" id="story-planet-bg"></div>
      <header class="story-topbar">
        <button class="back-button" id="back-characters">← <span> Change character</span></button>
        <!-- /*<span class="chapter-label" id="chapter-label">Chapter 01</span>*/ -->
        <button class="restart-button" id="restart-story" title="Почати спочатку">↺</button>
      </header>
      <div class="story-scene">
        <div class="scene-meta">
          <span class="live-dot"></span>
          <span id="scene-location">Moon</span>
        </div>
        <div class="character-stage">
          <img id="character-sprite" src="assets/rover-moon.svg" alt="Rover">
          <div id="character-model" class="character-model character-model--story"></div>
        </div>
        <div class="dialogue-panel">
          <div class="speaker-row">
            <span class="speaker-name" id="speaker-name">Rover</span>
            <span class="speaker-tag">Personal journal</span>
          </div>
          <p class="dialogue-text" id="dialogue-text" aria-live="polite"></p>
          <div class="story-gallery" id="story-gallery"></div>
          <div class="dialogue-bottom">
            <span class="progress-label" id="progress-label">01 / 05</span>
            <button class="next-button" id="next-slide">Next <span aria-hidden="true">→</span></button>
            <button id="audio-toggle" class="audio-toggle" type="button">
              ▶ Play audio
            </button>
          </div>
        </div>
      </div>

    </section>
  <!-- Повноекранний перегляд фото -->
    <div class="photo-lightbox" id="photo-lightbox" aria-hidden="true">
      <button class="photo-lightbox__close" id="photo-lightbox-close" aria-label="Закрити фото">✕</button>
      <img class="photo-lightbox__img" id="photo-lightbox-img" src="" alt="">
    </div>
  </main>
  <script type="module" src="/script.js"></script>
</body>
</html>
